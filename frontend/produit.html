<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Y-Shop - Votre boutique de Fruits du Démon. Filtrez et achetez les fruits les plus puissants du monde One Piece.">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Produits – Y-Shop</title>
</head>

<body>
    <!-- Header / Navbar -->
    <header>
        <nav class="navbar section-content">
            <a href="./index.html" class="nav-logo">
                <img src="./assets/images/chapeau.png" alt="Logo Y-Shop" class="logo-image">
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="./index.html" class="nav-link">Accueil</a>
                </li>
                <li class="nav-item">
                    <a href="./produit.html" class="nav-link active">Produits</a>
                </li>
                <li class="nav-item">
                    <a href="./favoris.html" class="nav-link">Favoris</a>
                </li>
            </ul>

            <div class="nav-icon">
                <!-- Favoris -->
                <a href="./favoris.html" class="nav-icon-link" title="Mes favoris">
                    <i class="fa-regular fa-heart"></i>
                    <span id="compteur-favoris" class="badge-compteur" style="display:none;">0</span>
                </a>
                <!-- Panier -->
                <a href="./panier.html" class="nav-icon-link" title="Mon panier">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 4H6.17l-.18-1.15A1 1 0 0 0 5 2H2v2h2.14l1.87 12.15A1 1 0 0 0 7 17h12v-2H7.86l-.31-2H19c.45 0 .84-.3.96-.73l2-7A1 1 0 0 0 21 3.99Zm-2.75 7H7.24l-.77-5h13.2l-1.43 5ZM8 18a2 2 0 1 0 0 4 2 2 0 1 0 0-4m9 0a2 2 0 1 0 0 4 2 2 0 1 0 0-4"></path>
                    </svg>
                    <span id="compteur-panier" class="badge-compteur" style="display:none;">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Section bannière catalogue -->
    <section class="main-home">
        <div class="main-text">
            <h5>Nos Produits</h5>
            <h2>Découvrez notre gamme de Fruits du Démon</h2>
            <p>Soigneusement sélectionnés dans tout le Grand Line. Que vous recherchiez un Paramecia, un Zoan ou un Logia, nous avons ce qu'il vous faut.</p>
            <a href="#trending" class="main-button">Voir les produits</a>
        </div>
        <div class="down-arrow">
            <a href="#trending" class="down"><i class="fa-solid fa-arrow-down"></i></a>
        </div>
    </section>

    <!-- Section catalogue produits -->
    <section class="trending-product" id="trending">
        <div class="center-text">
            <h2>Nos <span>Produits</span></h2>
        </div>

        <!-- Barre de filtres et tri -->
        <div class="filtres-container section-content">
            <div class="filtres-categories">
                <button class="btn-filtre active" data-categorie="tous">Tous</button>
                <button class="btn-filtre" data-categorie="Paramecia">Paramecia</button>
                <button class="btn-filtre" data-categorie="Zoan">Zoan</button>
                <button class="btn-filtre" data-categorie="Zoan Mythique">Zoan Mythique</button>
                <button class="btn-filtre" data-categorie="Logia">Logia</button>
            </div>

            <div class="tri-container">
                <label for="select-tri">Trier par :</label>
                <select id="select-tri">
                    <option value="defaut">Par défaut</option>
                    <option value="prix-asc">Prix croissant</option>
                    <option value="prix-desc">Prix décroissant</option>
                    <option value="nom-asc">Nom (A → Z)</option>
                </select>
            </div>
        </div>

        <!-- Conteneur des cartes produits (rempli par JS) -->
        <div class="products" id="products-container"></div>
    </section>

    <script src="./js/main.js"></script>
    <script src="./js/produit.js"></script>
</body>

</html>
