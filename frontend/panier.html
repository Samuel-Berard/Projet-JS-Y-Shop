<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Y-Shop - Votre panier d'achat. Gérez vos Fruits du Démon et passez votre commande.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Mon Panier – Y-Shop</title>
</head>

<body>
    <!-- Header / Navbar -->
    <header>
        <nav class="navbar section-content">
            <a href="/index.html" class="nav-logo">
                <img src="/assets/images/chapeau.png" alt="Logo Y-Shop" class="logo-image">
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/index.html" class="nav-link">Accueil</a>
                </li>
                <li class="nav-item">
                    <a href="/produit.html" class="nav-link">Produits</a>
                </li>
                <li class="nav-item">
                    <a href="/favoris.html" class="nav-link">Favoris</a>
                </li>
            </ul>
            <div class="nav-icon">
                <a href="/favoris.html" class="nav-icon-link" title="Mes favoris">
                    <i class="fa-regular fa-heart"></i>
                    <span id="compteur-favoris" class="badge-compteur" style="display:none;">0</span>
                </a>
                <a href="/panier.html" class="nav-icon-link active" title="Mon panier">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 4H6.17l-.18-1.15A1 1 0 0 0 5 2H2v2h2.14l1.87 12.15A1 1 0 0 0 7 17h12v-2H7.86l-.31-2H19c.45 0 .84-.3.96-.73l2-7A1 1 0 0 0 21 3.99Zm-2.75 7H7.24l-.77-5h13.2l-1.43 5ZM8 18a2 2 0 1 0 0 4 2 2 0 1 0 0-4m9 0a2 2 0 1 0 0 4 2 2 0 1 0 0-4"></path>
                    </svg>
                    <span id="compteur-panier" class="badge-compteur" style="display:none;">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Contenu principal du panier -->
    <main class="panier-main section-content">
        <h1 class="panier-titre">Mon Panier</h1>

        <!-- Liste des articles du panier (remplie par panier.js) -->
        <div id="panier-liste"></div>

        <!-- Récapitulatif et total -->
        <div id="panier-recap" class="panier-recap" style="display:none;">
            <div class="panier-total">
                <span>Total :</span>
                <strong id="panier-total-prix">0 BERRY</strong>
            </div>
            <div class="panier-actions">
                <button id="btn-vider-panier" class="btn-vider">Vider le panier</button>
                <button id="btn-commander" class="btn-commander">Passer la commande</button>
            </div>
        </div>

        <!-- Message si panier vide -->
        <div id="panier-vide" class="panier-vide" style="display:none;">
            <p>Votre panier est vide.</p>
            <a href="/produit.html" class="btn-retour-boutique">Retourner à la boutique</a>
        </div>

        <!-- Message de confirmation commande -->
        <div id="panier-confirmation" class="panier-confirmation" style="display:none;">
            <h2>Commande passée !</h2>
            <p>Votre commande a bien été enregistrée. Votre fruit sera livré par News Coo dans les plus brefs délais !</p>
            <a href="/produit.html" class="btn-retour-boutique">Continuer mes achats</a>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/panier.js"></script>
</body>

</html>
