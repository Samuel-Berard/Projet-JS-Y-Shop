<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Y-Shop - Mes favoris. Retrouvez tous les Fruits du Démon que vous avez aimés.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Mes Favoris – Y-Shop</title>
</head>

<body>
    <!-- Header / Navbar -->
    <header>
        <nav class="navbar section-content">
            <a href="/index.html" class="nav-logo">
                <img src="/assets/images/chapeau.png" alt="Logo Y-Shop" class="logo-image">
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/index.html" class="nav-link">Accueil</a>
                </li>
                <li class="nav-item">
                    <a href="/produit.html" class="nav-link">Produits</a>
                </li>
                <li class="nav-item">
                    <a href="/favoris.html" class="nav-link active">Favoris</a>
                </li>
            </ul>
            <div class="nav-icon">
                <a href="/favoris.html" class="nav-icon-link active" title="Mes favoris">
                    <i class="fa-solid fa-heart"></i>
                    <span id="compteur-favoris" class="badge-compteur" style="display:none;">0</span>
                </a>
                <a href="/panier.html" class="nav-icon-link" title="Mon panier">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 4H6.17l-.18-1.15A1 1 0 0 0 5 2H2v2h2.14l1.87 12.15A1 1 0 0 0 7 17h12v-2H7.86l-.31-2H19c.45 0 .84-.3.96-.73l2-7A1 1 0 0 0 21 3.99Zm-2.75 7H7.24l-.77-5h13.2l-1.43 5ZM8 18a2 2 0 1 0 0 4 2 2 0 1 0 0-4m9 0a2 2 0 1 0 0 4 2 2 0 1 0 0-4"></path>
                    </svg>
                    <span id="compteur-panier" class="badge-compteur" style="display:none;">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Contenu principal favoris -->
    <main class="panier-main section-content">
        <h1 class="panier-titre">Mes Favoris</h1>

        <!-- Liste des favoris (remplie par favoris.js) -->
        <div class="products" id="favoris-liste"></div>

        <!-- Message si aucun favori -->
        <div id="favoris-vide" class="panier-vide" style="display:none;">
            <p>Vous n'avez pas encore de favoris.</p>
            <a href="/produit.html" class="btn-retour-boutique">Découvrir les produits</a>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/favoris.js"></script>
</body>

</html>
